$('checkSimplified').addEventListener('click',checkSimplified);$('simplified').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkSimplified()}});$('plus').onclick=()=>choose(1);$('minus').onclick=()=>choose(-1);$('check').addEventListener('click',checkResponse);$('form').onsubmit=e=>{e.preventDefault();if(isAddSub()&&!simplifiedOK)checkSimplified();else checkResponse()};$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkResponse()}});$('helpBtn').onclick=()=>help();$('next').addEventListener('click',nextExercise);$('topic').onchange=()=>{index=0;bag=[];if(topic()==='mix')mode='practice';$('learn').disabled=topic()==='mix';load()};$('level').onchange=()=>load();$('learn').onclick=()=>{mode='learn';index=0;load()};$('practice').onclick=()=>{mode='practice';index=0;load()};

function updateLanguage(){setupSteps();document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';document.title=T('title');$('title').textContent=T('title');['learn','practice','check'].forEach(id=>$(id).textContent=T(id));$('helpBtn').textContent=T(isAddSub()&&!simplifiedOK?'helpSimplifying':'showSteps');$('next').textContent=mode==='learn'&&index===sequences[topic()]?.length-1?T('nowPractice'):T('next');for(let option of $('topic').options)option.textContent=T(option.value);for(let option of $('level').options)option.textContent=T('level'+option.value);$('topic').setAttribute('aria-label',T('calculation'));$('level').setAttribute('aria-label',T('level'));$('modeChoices').setAttribute('aria-label',T('learn')+' / '+T('practice'));$('plus').setAttribute('aria-label',T('plus'));$('minus').setAttribute('aria-label',T('minus'));$('answer').setAttribute('placeholder',T('number'));$('answer').setAttribute('aria-label',T('unsigned'));document.querySelector('.signs').setAttribute('aria-label',T('sign'));const helpOpen=!$('help').classList.contains('hidden');if(t){if(mode==='learn')renderLearning();renderTask();if(helpOpen)help();if(lastFeedback){const saved=lastFeedback;feedback(saved.key,saved.kind,saved.args);}}}
$('language').onchange=()=>{language=$('language').value;updateLanguage();try{localStorage.setItem('integerTrainerLanguage',language)}catch{}};
try{const saved=localStorage.getItem('integerTrainerLanguage');if(['de','fr','en','ar','tr'].includes(saved))language=saved;}catch{}
$('language').value=language;load();updateLanguage();

</script></body></html>
